services:
  backend:
    build: ./backend
    container_name: khuli-kitab-backend
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/uploads:/app/uploads
      - ./backend/credentials.json:/app/credentials.json
      - ./backend/token.json:/app/token.json
    restart: unless-stopped

